# Nemotron-H (hybrid Mamba2 + attention + MoE) — long-context QLoRA SFT with
# ringmaster context parallelism + FSDP2.
#
# Nemotron-H interleaves Mamba2 SSM, sparse attention, and MoE blocks. The plugin
# wires the Mamba2 scan for CP state-passing (each rank scans its sequence chunk; a
# correction passes SSM state across CP ranks — exact, comm O(state) and
# seq-independent). The SSM recurrence needs contiguous token order, so the plugin
# forces contiguous CP sharding (zigzag would permute tokens and break the scan).
#
# Requirements:
#   pip install mamba-ssm causal-conv1d        # Mamba2 CUDA kernels
# The FlaSm120ShimPlugin also presets the locally-installed mamba/causal-conv1d
# kernels (so transformers doesn't lazy-load mismatched ones from the hub) and
# applies the sm_120 shim. 30B is large — full FT is impractical, so this uses QLoRA
# (orthogonal to CP/FSDP2; the CP wiring is identical for full FT).
#
#   axolotl train nemotron-h-cp-fsdp2.yaml

base_model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
trust_remote_code: false

plugins:
  - axolotl.integrations.context_parallel.ContextParallelPlugin
  - axolotl.integrations.fla_sm120_shim.FlaSm120ShimPlugin           # presets local mamba/causal-conv1d kernels
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

flash_attention: true

context_parallel:
  size: 8
  backend: ring
  ring_impl: hf_kernels
  # load_balance auto-forced to contiguous for hybrids (SSM scan is not zigzag-safe)

dp_shard_size: 1                 # world = dp_shard_size * context_parallel.size
fsdp_version: 2
fsdp_config:
  offload_params: false
  state_dict_type: SHARDED_STATE_DICT
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: NemotronHBlock
  reshard_after_forward: true

# QLoRA (30B): expert weights are 3D nn.Parameter tensors, attention lives in
# NemotronHBlock.mixer — disable the fused LoRA kernels and quantize the experts.
load_in_4bit: true
quantize_moe_experts: true
adapter: qlora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_mlp_kernel: false           # relu2 (mlp_hidden_act) unsupported by the kernel
lora_qkv_kernel: false           # attention is in NemotronHBlock.mixer, not self_attn
lora_o_kernel: false

chat_template: tokenizer_default
datasets:
  - path: mlabonne/FineTome-100k
    type: chat_template
    split: train[:20%]
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value
val_set_size: 0.0
output_dir: ./outputs/nemotron-h-cp-fsdp2
dataset_prepared_path: last_run_prepared

sequence_len: 16384
sample_packing: true             # Nemotron-H gradient checkpointing requires packing
pad_to_sequence_len: true

micro_batch_size: 1
gradient_accumulation_steps: 2
num_epochs: 1
optimizer: adamw_torch_4bit
lr_scheduler: cosine
learning_rate: 2.0e-4
warmup_ratio: 0.1
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
logging_steps: 1
saves_per_epoch: 1
