[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ringmaster"
version = "0.0.1"
description = "Composable long-context attention: Ulysses / Ring / USP sequence parallelism for any framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Axolotl AI" }]
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.11",
]

[project.optional-dependencies]
transformers = ["transformers>=5.9"]
dev = ["pytest", "transformers>=5.9"]

[tool.setuptools.packages.find]
include = ["ringmaster*"]

[tool.pytest.ini_options]
markers = [
    "slow: multi-process gloo/spawn tests (deselect with -m 'not slow')",
]
